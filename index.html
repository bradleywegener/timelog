<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="timelog"
  >
  <meta
    name="theme-color"
    content="#0D1117"
  >

  <title>timelog</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div>
    <div class="logo">timelog</div>
    <div class="logo-sub">personal productivity tracker</div>
  </div>
</header>


<div id="content">

  <main>

    <!-- TRACK -->

    <div id="view-track" class="view active">

      <!-- Active timer -->

      <div id="active-card" class="card hidden">

        <div id="timer-display">

          <div class="section-label recording-label">
            recording
          </div>

          <div class="time" id="elapsed-display">
            0s
          </div>

          <div class="timer-meta">

            <span
              class="pulse-dot"
              id="pulse-dot"
            ></span>

            <span id="active-label-display"></span>

            <span class="muted">
              ·
            </span>

            <span
              id="active-cat-display"
              class="muted"
            ></span>

          </div>

          <button
            id="stop-timer-btn"
            class="btn btn-stop"
          >
            Stop &amp; Save
          </button>

        </div>

      </div>


      <!-- New entry -->

      <div
        id="new-entry-card"
        class="card"
      >

        <div class="section-label">
          new entry
        </div>

        <div class="field-label">
          category
        </div>

        <div
          class="cat-pills"
          id="cat-pills"
        ></div>

        <div class="field-label">
          what are you doing? (optional)
        </div>

        <input
          type="text"
          id="entry-label"
          placeholder="e.g. Writing, Morning walk…"
          autocomplete="off"
          autocorrect="off"
        >

        <button
          id="start-timer-btn"
          class="btn btn-start"
        >
          ▶ Start Timer
        </button>

      </div>


      <!-- Today -->

      <div
        id="today-card"
        class="card hidden"
      >

        <div class="today-header">

          <div class="section-label today-label">
            today
          </div>

          <div
            id="today-total"
            class="today-total"
          ></div>

        </div>

        <div id="today-entries"></div>

      </div>

    </div>


    <!-- LOG -->

    <div
      id="view-log"
      class="view"
    >

      <div id="log-content"></div>

    </div>


    <!-- INSIGHTS -->

    <div
      id="view-insights"
      class="view"
    >

      <div class="card">

        <div class="section-label">
          today's breakdown
        </div>

        <div id="today-bars"></div>

      </div>


      <div class="card">

        <div class="section-label">
          all time
        </div>

        <div
          class="stats-grid"
          id="all-time-stats"
        ></div>

      </div>

    </div>

  </main>

</div>


<!-- Navigation -->

<nav>

  <button
    class="nav-btn active"
    data-view="track"
  >
    <span class="nav-icon">⏱</span>
    track
  </button>

  <button
    class="nav-btn"
    data-view="log"
  >
    <span class="nav-icon">📋</span>
    log
  </button>

  <button
    class="nav-btn"
    data-view="insights"
  >
    <span class="nav-icon">📊</span>
    insights
  </button>

</nav>


<script src="script.js"></script>

</body>
</html>
