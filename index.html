<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="timelog"
  >

  <meta
    name="theme-color"
    content="#0F1115"
  >

  <link rel="manifest" href="manifest.json">

  <link
    rel="apple-touch-icon"
    href="icons/apple-touch-icon.png"
  >

  <title>timelog</title>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@700;800&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div>
    <div class="logo">timelog</div>
    <div class="logo-sub">personal productivity tracker</div>
  </div>

  <div class="header-actions">

    <button
      class="theme-toggle"
      id="theme-toggle"
      onclick="toggleTheme()"
      aria-label="Toggle light and dark mode"
    >
      <svg
        class="theme-icon theme-icon-sun"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="M4.93 4.93l1.41 1.41"></path>
        <path d="M17.66 17.66l1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="M4.93 19.07l1.41-1.41"></path>
        <path d="M17.66 6.34l1.41-1.41"></path>
      </svg>

      <svg
        class="theme-icon theme-icon-moon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5a8.5 8.5 0 1 0 12 12z"></path>
      </svg>
    </button>

    <div class="app-version" data-version></div>

  </div>
</header>


<div id="content">

  <main>

    <!-- ==================================================
         TRACK
         ================================================== -->

    <div id="view-track" class="view active">

      <div
        id="active-card"
        class="card"
        style="display:none;"
      >

        <div id="timer-display">

          <div class="section-label recording-label">
            recording
          </div>

          <div
            class="time"
            id="elapsed-display"
          >
            0s
          </div>

          <div class="timer-meta">

            <span
              class="pulse-dot"
              id="pulse-dot"
            ></span>

            <span id="active-label-display"></span>

            <span class="muted">·</span>

            <span
              id="active-cat-display"
              class="muted"
            ></span>

          </div>

          <button
            class="btn btn-stop"
            onclick="stopTimer()"
          >
            Stop &amp; Save
          </button>

        </div>

      </div>


      <div
        id="new-entry-card"
        class="card"
      >

        <div class="section-label">
          new entry
        </div>

        <div class="field-label">
          category
        </div>

        <div
          class="cat-pills"
          id="cat-pills"
        ></div>

        <div class="field-label">
          what are you doing? (optional)
        </div>

        <input
          type="text"
          id="entry-label"
          placeholder="e.g. Writing, Morning walk…"
          autocomplete="off"
          autocorrect="off"
        >

        <button
          class="btn btn-start"
          onclick="startTimer()"
        >
          ▶ Start Timer
        </button>

      </div>


      <div
        id="today-card"
        class="card"
        style="display:none"
      >

        <div class="today-header">

          <div class="section-label today-label">
            today
          </div>

          <div
            class="today-total"
            id="today-total"
          ></div>

        </div>

        <div id="today-entries"></div>

      </div>

    </div>


    <!-- ==================================================
         LOG
         ================================================== -->

    <div id="view-log" class="view">

      <div id="log-content"></div>

    </div>


    <!-- ==================================================
         INSIGHTS
         ================================================== -->

    <div id="view-insights" class="view">

      <div class="card">

        <div class="insights-date-nav">

          <button
            class="date-nav-btn"
            id="previous-day"
            onclick="changeInsightDay(-1)"
            aria-label="Previous day"
          >
            ‹
          </button>

          <div class="insights-date">

            <div
              class="insights-date-label"
              id="insights-date-label"
            >
              TODAY
            </div>

            <div
              class="insights-date-total"
              id="insights-date-total"
            >
              0s
            </div>

          </div>

          <button
            class="date-nav-btn"
            id="next-day"
            onclick="changeInsightDay(1)"
            aria-label="Next day"
          >
            ›
          </button>

        </div>

      </div>


      <div class="card">

        <div class="section-label">
          day's breakdown
        </div>

        <div id="selected-day-bars"></div>

      </div>


      <div class="card">

        <div class="weekly-header">

          <div class="section-label weekly-label">
            weekly breakdown
          </div>

          <div
            class="weekly-total"
            id="weekly-total"
          ></div>

        </div>

        <div id="weekly-breakdown"></div>

      </div>


      <div class="card">

        <div class="section-label">
          all time
        </div>

        <div
          class="stats-grid"
          id="all-time-stats"
        ></div>

      </div>

    </div>

  </main>

</div>


<!-- ==================================================
     NAVIGATION
     ================================================== -->

<nav class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="switchView('track', this)"
    aria-label="Track"
  >
    <span class="nav-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="M12 7.5v5l3 2"></path>
      </svg>
    </span>

    <span class="nav-label">Track</span>
  </button>


  <button
    class="nav-btn"
    onclick="switchView('log', this)"
    aria-label="Log"
  >
    <span class="nav-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="4.5" width="12" height="15" rx="2"></rect>
        <path d="M9 9h6"></path>
        <path d="M9 12.5h6"></path>
        <path d="M9 16h4"></path>
      </svg>
    </span>

    <span class="nav-label">Log</span>
  </button>


  <button
    class="nav-btn"
    onclick="switchView('insights', this)"
    aria-label="Insights"
  >
    <span class="nav-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 19V10"></path>
        <path d="M12 19V5"></path>
        <path d="M19 19v-7"></path>
      </svg>
    </span>

    <span class="nav-label">Insights</span>
  </button>

</nav>


<footer class="app-footer">
  timelog <span data-version></span>
</footer>


<script src="script.js"></script>

</body>
</html>
